<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Погода у містах</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>
<body class="bg-light">
    <div class="container mt-5" style="max-width: 600px;">
        <div class="card shadow-sm p-4">
            <h2 class="mb-4 text-center">Прогноз погоди</h2>
            
         
            <form id="weatherForm">
                <div class="mb-3">
                    <label for="cityName" class="form-label">Введіть назву міста:</label>
                    <input type="text" class="form-control" id="cityName" placeholder="Наприклад, Київ" required />
                </div>
                <button type="submit" class="btn btn-primary w-100">Дізнатися погоду</button>
            </form>

          
            <div id="errorAlert" class="alert alert-danger mt-3 d-none" role="alert"></div>

           
            <div id="weatherResult" class="card mt-4 p-3 d-none bg-white border">
                <h4 id="resCityName" class="text-primary"></h4>
                <p class="mb-1"><strong>Температура:</strong> <span id="resTemp"></span> °C</p>
                <p class="mb-1"><strong>Опис:</strong> <span id="resDesc"></span></p>
                <p class="mb-0"><strong>Вологість:</strong> <span id="resHumidity"></span>%</p>
            </div>
        </div>
    </div>

    <script>
        document.getElementById("weatherForm").addEventListener("submit", async (e) => {
            e.preventDefault();
            
            const cityName = document.getElementById("cityName").value.trim();
            const errorAlert = document.getElementById("errorAlert");
            const weatherResult = document.getElementById("weatherResult");
            
   
            errorAlert.classList.add("d-none");
            weatherResult.classList.add("d-none");

            try {
                const response = await fetch(`/api/weather/${encodeURIComponent(cityName)}`);
                
                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.message || "Помилка отримання даних.");
                }

                const data = await response.json();

          
                document.getElementById("resCityName").innerText = data.name;
                document.getElementById("resTemp").innerText = data.main.temp;
                document.getElementById("resDesc").innerText = data.weather[0].description;
                document.getElementById("resHumidity").innerText = data.main.humidity;

                weatherResult.classList.remove("d-none");
            } catch (err) {
                errorAlert.innerText = err.message;
                errorAlert.classList.remove("d-none");
            }
        });
    </script>
</body>
</html>
